[project]
name = "unitree-go2-handoff-intent-detector"
version = "0.1.0"
description = "Unitree Go2 handoff intent detection code"
requires-python = ">=3.8"

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*"]