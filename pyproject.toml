[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "unitree-go2-handoff-intent-detector"
version = "0.1.0"
description = "Unitree Go2 handoff intent detection code"
requires-python = ">=3.8"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "model_training_and_implementation*",
    "quest_hand_intent_model_est*",
    "shared*",
]
exclude = [
    "dataset_collection*",
    "data*",
    "outputs*",
]