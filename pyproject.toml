[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"


[project]
name = "unitree-go2-handoff-intent-detector"
version = "0.1.0"
description = "Unitree Go2 handoff intent detection and deployment system"
requires-python = ">=3.8,<3.10"

# Dependencies needed to RUN the deployed system:
#   - ROS handoff detector's underlying Python model
#   - handoff/server application
#   - robot detection/tracking/FoV estimation
#   - Quest hand-intent estimation/guidance
dependencies = [
    "numpy==1.26.4",
    "Pillow==9.5.0",
    "PyYAML==6.0.3",
    "scipy==1.13.1",

    # Computer vision
    "opencv-python==4.8.1.78",
    "rtmlib==0.0.15",
    "onnxruntime-gpu==1.19.2",

    # PyTorch / model inference
    "torch==2.4.1",
    "torchvision==0.19.1",
    "transformers==4.57.6",

    # Robot detection / tracking
    "ultralytics==8.4.83",
    "timm==0.5.4",
    "easydict==1.9",

    # Server
    "fastapi==0.128.8",
    "starlette==0.49.3",
    "uvicorn==0.39.0",
    "pydantic==2.13.4",

    # ROS control_box_servo.py imports `serial`
    "pyserial==3.5",
]


[project.optional-dependencies]

# Needed to train/evaluate the handoff and Quest models.
training = [
    "accelerate==1.10.1",
    "matplotlib==3.9.4",
    "pandas==2.3.3",
    "scikit-learn==1.6.1",
    "seaborn==0.13.2",
    "tensorboard==2.10.1",
    "tensorboardX==2.6.5",
    "tqdm==4.68.3",
]

# Extra tools used by OSTrack training/evaluation/analysis rather
# than the normal deployed tracker.
ostrack-dev = [
    "gdown==5.2.2",
    "jpeg4py==0.1.4",
    "matplotlib==3.9.4",
    "pandas==2.3.3",
    "pycocotools==2.0.11",
    "tensorboardX==2.6.5",
    "thop==0.1.1.post2209072238",
    "tqdm==4.68.3",
]

# Cloud/VLM experiments, not needed for normal deployment.
cloud-vlm = [
    "openai==2.46.0",
    "google-genai==1.47.0",
]

# Developer conveniences.
dev = [
    "black==21.4b2",
]


[tool.setuptools.packages.find]
where = ["."]

include = [
    "model_training_and_implementation*",
    "quest_hand_intent_model_est*",
    "shared*",
    "servers*",
    "robot_fov_estimation*",
]

exclude = [
    "ros_handoff_detection*",
    "dataset_collection*",
    "data*",
    "outputs*",
    "build*",
    "install*",
    "log*",
]